openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.2.0
  description: QueueCutter API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: forms
    description: Form catalog operations
  - name: sessions
    description: Guided interview sessions
  - name: ai
    description: AI copilot features
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  /countries:
    get:
      operationId: listCountries
      tags: [forms]
      summary: List supported countries
      description: Returns the list of countries with supported form catalogs
      responses:
        "200":
          description: Countries list
          content:
            application/json:
              schema:
                type: object
                properties:
                  countries:
                    type: array
                    items:
                      $ref: "#/components/schemas/Country"
                required: [countries]

  /forms:
    get:
      operationId: listForms
      tags: [forms]
      summary: List available forms
      description: Returns the catalog of supported government forms, optionally filtered by country
      parameters:
        - name: countryCode
          in: query
          required: false
          schema:
            type: string
          description: Filter forms by country code (US, IN, GB)
      responses:
        "200":
          description: List of forms
          content:
            application/json:
              schema:
                type: object
                properties:
                  forms:
                    type: array
                    items:
                      $ref: "#/components/schemas/FormSummary"
                required: [forms]

  /forms/{formId}:
    get:
      operationId: getForm
      tags: [forms]
      summary: Get form details
      description: Returns full form schema including questions and field mappings
      parameters:
        - name: formId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Form details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FormDetail"
        "404":
          description: Form not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /sessions:
    get:
      operationId: listSessions
      tags: [sessions]
      summary: List recent sessions
      responses:
        "200":
          description: List of sessions
          content:
            application/json:
              schema:
                type: object
                properties:
                  sessions:
                    type: array
                    items:
                      $ref: "#/components/schemas/SessionSummary"
                required: [sessions]

    post:
      operationId: createSession
      tags: [sessions]
      summary: Create a new session
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateSessionBody"
      responses:
        "201":
          description: Session created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Session"
        "400":
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /sessions/{sessionId}:
    get:
      operationId: getSession
      tags: [sessions]
      summary: Get session state
      parameters:
        - name: sessionId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Session state
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Session"
        "404":
          description: Session not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /sessions/{sessionId}/persona:
    put:
      operationId: updatePersona
      tags: [sessions]
      summary: Save persona profile for a session
      parameters:
        - name: sessionId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Persona"
      responses:
        "200":
          description: Updated session
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Session"
        "404":
          description: Session not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /sessions/{sessionId}/answers:
    put:
      operationId: updateAnswers
      tags: [sessions]
      summary: Update session answers
      parameters:
        - name: sessionId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateAnswersBody"
      responses:
        "200":
          description: Updated session
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Session"
        "404":
          description: Session not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /sessions/{sessionId}/preview:
    get:
      operationId: getPreview
      tags: [sessions]
      summary: Get field preview
      parameters:
        - name: sessionId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Field preview
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PreviewResult"
        "404":
          description: Session not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /sessions/{sessionId}/risk-score:
    get:
      operationId: getRiskScore
      tags: [sessions]
      summary: Get rejection risk score for a session
      parameters:
        - name: sessionId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Risk score result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RiskScoreResult"
        "404":
          description: Session not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /sessions/{sessionId}/warnings:
    get:
      operationId: getWarnings
      tags: [sessions]
      summary: Get session warnings
      parameters:
        - name: sessionId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Warnings list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WarningsResult"
        "404":
          description: Session not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /sessions/{sessionId}/checklist:
    get:
      operationId: getChecklist
      tags: [sessions]
      summary: Get document checklist
      parameters:
        - name: sessionId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Checklist
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChecklistResult"
        "404":
          description: Session not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /sessions/{sessionId}/pdf:
    post:
      operationId: generatePdf
      tags: [sessions]
      summary: Generate filled PDF
      parameters:
        - name: sessionId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: PDF generation result with download URL
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PdfResult"
        "404":
          description: Session not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /sessions/{sessionId}/pdf/download:
    get:
      operationId: downloadPdf
      tags: [sessions]
      summary: Download generated PDF
      parameters:
        - name: sessionId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: PDF file
          content:
            application/pdf:
              schema:
                type: string
                format: binary
        "404":
          description: Session or PDF not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /ai/explain:
    post:
      operationId: aiExplain
      tags: [ai]
      summary: Explain a form question in plain language
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AiExplainRequest"
      responses:
        "200":
          description: AI explanation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AiExplainResponse"

  /ai/interpret:
    post:
      operationId: aiInterpret
      tags: [ai]
      summary: Interpret a natural-language answer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AiInterpretRequest"
      responses:
        "200":
          description: AI interpretation result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AiInterpretResponse"

  /ai/simplify:
    post:
      operationId: aiSimplify
      tags: [ai]
      summary: Simplify a form question for a user persona
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AiSimplifyRequest"
      responses:
        "200":
          description: Simplified question
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AiSimplifyResponse"

  /ai/inconsistencies:
    post:
      operationId: aiInconsistencies
      tags: [ai]
      summary: Detect inconsistencies across all answers
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AiInconsistenciesRequest"
      responses:
        "200":
          description: Inconsistency detection result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AiInconsistenciesResponse"

  /ai/discover:
    post:
      operationId: aiDiscover
      tags: [ai]
      summary: Discover the right form from a free-text situation description
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AiDiscoverRequest"
      responses:
        "200":
          description: Form discovery result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AiDiscoverResponse"

components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required: [status]

    ErrorResponse:
      type: object
      properties:
        error:
          type: string
        message:
          type: string
      required: [error, message]

    Country:
      type: object
      properties:
        code:
          type: string
        name:
          type: string
        flag:
          type: string
        description:
          type: string
      required: [code, name, flag, description]

    Persona:
      type: object
      properties:
        role:
          type: string
          enum: [Student, Working Professional, Self-Employed, Senior Citizen, Unemployed, Other]
        priorExperience:
          type: string
          enum: [First time, "Applied before but it was rejected", "Applied before and got it", Not sure]
        comfort:
          type: string
          enum: ["I find it confusing", "I manage okay", "I'm comfortable with it"]
      required: [role, priorExperience, comfort]

    FormSummary:
      type: object
      properties:
        id:
          type: string
        countryCode:
          type: string
        name:
          type: string
        shortDescription:
          type: string
        whoItIsFor:
          type: string
        estimatedMinutes:
          type: integer
        questionCount:
          type: integer
        category:
          type: string
      required: [id, countryCode, name, shortDescription, whoItIsFor, estimatedMinutes, questionCount, category]

    FormQuestion:
      type: object
      properties:
        id:
          type: string
        text:
          type: string
        hint:
          type: string
        hintHi:
          type: string
        type:
          type: string
          enum: [text, date, select, radio, number, textarea, yesno]
        options:
          type: array
          items:
            type: string
        required:
          type: boolean
        fieldMapping:
          type: string
        officialLabel:
          type: string
        validationPattern:
          type: string
        conditionalOn:
          type: object
          properties:
            questionId:
              type: string
            value:
              type: string
          required: [questionId, value]
      required: [id, text, type, required, fieldMapping, officialLabel]

    FormDetail:
      type: object
      properties:
        id:
          type: string
        countryCode:
          type: string
        name:
          type: string
        officialName:
          type: string
        shortDescription:
          type: string
        longDescription:
          type: string
        whoItIsFor:
          type: string
        category:
          type: string
        requiredDocuments:
          type: array
          items:
            type: string
        commonRejectionReasons:
          type: array
          items:
            type: string
        questions:
          type: array
          items:
            $ref: "#/components/schemas/FormQuestion"
        submissionOffice:
          type: string
        submissionMethod:
          type: string
        processingTime:
          type: string
        fee:
          type: string
        disclaimer:
          type: string
      required: [id, countryCode, name, officialName, shortDescription, longDescription, whoItIsFor, category, requiredDocuments, commonRejectionReasons, questions, submissionOffice, submissionMethod, processingTime, fee, disclaimer]

    SessionStatus:
      type: string
      enum: [in_progress, completed, abandoned]

    Session:
      type: object
      properties:
        id:
          type: string
        formId:
          type: string
        formName:
          type: string
        countryCode:
          type: string
        status:
          $ref: "#/components/schemas/SessionStatus"
        currentStep:
          type: integer
        totalSteps:
          type: integer
        answers:
          type: object
          additionalProperties:
            type: string
        persona:
          $ref: "#/components/schemas/Persona"
        completionPercent:
          type: integer
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
      required: [id, formId, formName, countryCode, status, currentStep, totalSteps, answers, completionPercent, createdAt, updatedAt]

    SessionSummary:
      type: object
      properties:
        id:
          type: string
        formId:
          type: string
        formName:
          type: string
        countryCode:
          type: string
        status:
          $ref: "#/components/schemas/SessionStatus"
        completionPercent:
          type: integer
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
      required: [id, formId, formName, countryCode, status, completionPercent, createdAt, updatedAt]

    CreateSessionBody:
      type: object
      properties:
        formId:
          type: string
        countryCode:
          type: string
      required: [formId]

    UpdateAnswersBody:
      type: object
      properties:
        answers:
          type: object
          additionalProperties:
            type: string
        step:
          type: integer
      required: [answers, step]

    RiskFactor:
      type: object
      properties:
        description:
          type: string
        impact:
          type: integer
        category:
          type: string
          enum: [missing_required, inconsistency, optional_blank, rejection_pattern]
      required: [description, impact, category]

    ScoreComponent:
      type: object
      properties:
        name:
          type: string
        score:
          type: integer
          description: "0-100, higher = more submission-ready"
        label:
          type: string
        explanation:
          type: string
        improvement:
          type: string
      required: [name, score, label, explanation]

    RiskScoreResult:
      type: object
      properties:
        sessionId:
          type: string
        score:
          type: integer
          description: "Risk score 0-100. 0 = no risk (perfect). 100 = maximum risk."
        level:
          type: string
          enum: [low, medium, high]
        headline:
          type: string
        factors:
          type: array
          items:
            $ref: "#/components/schemas/RiskFactor"
        components:
          type: array
          items:
            $ref: "#/components/schemas/ScoreComponent"
        disclaimer:
          type: string
      required: [sessionId, score, level, headline, factors, components, disclaimer]

    MappedField:
      type: object
      properties:
        fieldName:
          type: string
        officialLabel:
          type: string
        value:
          type: string
        source:
          type: string
          enum: [user_answer, inferred, default]
        confidence:
          type: string
          enum: [high, medium, low]
        isEmpty:
          type: boolean
      required: [fieldName, officialLabel, value, source, confidence, isEmpty]

    PreviewResult:
      type: object
      properties:
        sessionId:
          type: string
        formName:
          type: string
        mappedFields:
          type: array
          items:
            $ref: "#/components/schemas/MappedField"
        completionPercent:
          type: integer
        missingCount:
          type: integer
        warningCount:
          type: integer
      required: [sessionId, formName, mappedFields, completionPercent, missingCount, warningCount]

    Warning:
      type: object
      properties:
        id:
          type: string
        severity:
          type: string
          enum: [error, warning, info]
        category:
          type: string
          enum: [missing, format, inconsistency, eligibility, general]
        field:
          type: string
        message:
          type: string
        suggestion:
          type: string
      required: [id, severity, category, message, suggestion]

    WarningsResult:
      type: object
      properties:
        sessionId:
          type: string
        warnings:
          type: array
          items:
            $ref: "#/components/schemas/Warning"
        errorCount:
          type: integer
        warningCount:
          type: integer
        infoCount:
          type: integer
      required: [sessionId, warnings, errorCount, warningCount, infoCount]

    ChecklistItem:
      type: object
      properties:
        id:
          type: string
        category:
          type: string
          enum: [carry, verify, do_next]
        text:
          type: string
        required:
          type: boolean
        note:
          type: string
        rejectionRisk:
          type: boolean
      required: [id, category, text, required]

    SubmissionStep:
      type: object
      properties:
        step:
          type: integer
        title:
          type: string
        description:
          type: string
      required: [step, title, description]

    ChecklistResult:
      type: object
      properties:
        sessionId:
          type: string
        formName:
          type: string
        items:
          type: array
          items:
            $ref: "#/components/schemas/ChecklistItem"
        submissionSteps:
          type: array
          items:
            $ref: "#/components/schemas/SubmissionStep"
        submissionOffice:
          type: string
        processingTime:
          type: string
        fee:
          type: string
        warnings:
          type: array
          items:
            type: string
        disclaimer:
          type: string
      required: [sessionId, formName, items, submissionSteps, submissionOffice, processingTime, fee, warnings, disclaimer]

    PdfResult:
      type: object
      properties:
        sessionId:
          type: string
        downloadUrl:
          type: string
        generatedAt:
          type: string
          format: date-time
        fieldCount:
          type: integer
        filledCount:
          type: integer
      required: [sessionId, downloadUrl, generatedAt, fieldCount, filledCount]

    AiExplainRequest:
      type: object
      properties:
        questionId:
          type: string
        questionText:
          type: string
        hint:
          type: string
        formName:
          type: string
        officialLabel:
          type: string
      required: [questionId, questionText, formName, officialLabel]

    AiExplainResponse:
      type: object
      properties:
        questionId:
          type: string
        explanation:
          type: string
        whyWeAsk:
          type: string
        commonMistakes:
          type: array
          items:
            type: string
        example:
          type: string
      required: [questionId, explanation, whyWeAsk, commonMistakes]

    AiInterpretRequest:
      type: object
      properties:
        questionId:
          type: string
        questionText:
          type: string
        questionType:
          type: string
        rawInput:
          type: string
        options:
          type: array
          items:
            type: string
      required: [questionId, questionText, questionType, rawInput]

    AiInterpretResponse:
      type: object
      properties:
        questionId:
          type: string
        interpretedValue:
          type: string
        confidence:
          type: string
          enum: [high, medium, low]
        explanation:
          type: string
        needsClarification:
          type: boolean
        clarificationPrompt:
          type: string
      required: [questionId, interpretedValue, confidence, explanation, needsClarification]

    AiSimplifyRequest:
      type: object
      properties:
        questionId:
          type: string
        questionText:
          type: string
        hint:
          type: string
        officialLabel:
          type: string
        formName:
          type: string
        countryCode:
          type: string
        persona:
          $ref: "#/components/schemas/Persona"
      required: [questionId, questionText, officialLabel, formName, countryCode]

    AiSimplifyResponse:
      type: object
      properties:
        questionId:
          type: string
        simplifiedText:
          type: string
        simplifiedHint:
          type: string
      required: [questionId, simplifiedText]

    AiInconsistenciesRequest:
      type: object
      properties:
        sessionId:
          type: string
        formId:
          type: string
        answers:
          type: object
          additionalProperties:
            type: string
      required: [sessionId, formId, answers]

    AiInconsistenciesResponse:
      type: object
      properties:
        sessionId:
          type: string
        inconsistencies:
          type: array
          items:
            type: object
            properties:
              fields:
                type: array
                items:
                  type: string
              message:
                type: string
              severity:
                type: string
                enum: [error, warning]
            required: [fields, message, severity]
        checkedAt:
          type: string
          format: date-time
      required: [sessionId, inconsistencies, checkedAt]

    AiDiscoverRequest:
      type: object
      properties:
        situation:
          type: string
          description: Free-text description of the user's situation
      required: [situation]

    AiDiscoverResponse:
      type: object
      properties:
        formId:
          type: string
          nullable: true
          description: The matched form ID, or null if no match
        formName:
          type: string
          nullable: true
        countryCode:
          type: string
          nullable: true
        reason:
          type: string
          description: Explanation of why this form was matched (or why nothing matched)
      required: [formId, formName, countryCode, reason]
